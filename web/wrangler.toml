name = "p2p"
main = "../edge/cloudflare-worker/worker.js"
compatibility_date = "2024-04-03"
assets = { directory = "./dist", binding = "ASSETS" }
workers_dev = true

# Optional: Custom domain routes can be configured here or in gitignored wrangler.local.toml
# routes = [
#   { pattern = "p2p.yourdomain.com", custom_domain = true }
# ]

[durable_objects]
bindings = [
  { name = "ROOM", class_name = "SignalingRoom" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SignalingRoom"]

# Dedicated Testing Environment: testing.p2p
[env.testing]
name = "testing-p2p"
workers_dev = true

# routes = [
#   { pattern = "testing.p2p.yourdomain.com", custom_domain = true }
# ]

[env.testing.durable_objects]
bindings = [
  { name = "ROOM", class_name = "SignalingRoom" }
]

[[env.testing.migrations]]
tag = "v1"
new_sqlite_classes = ["SignalingRoom"]


