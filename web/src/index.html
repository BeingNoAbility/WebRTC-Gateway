<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>P2P WebRTC Gateway Portal</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <style>
    :root {
      --bg: #0d1117;
      --card-bg: #161b22;
      --border: #30363d;
      --text: #c9d1d9;
      --text-dim: #8b949e;
      --primary: #58a6ff;
      --success: #3fb950;
      --warning: #d29922;
      --danger: #f85149;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace; }
    body { background: var(--bg); color: var(--text); padding: 24px; min-height: 100vh; }
    .container { max-width: 900px; margin: 0 auto; }
    header { margin-bottom: 24px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 16px; }
    h1 { font-size: 20px; font-weight: 600; color: #f0f6fc; }
    .badge { padding: 4px 10px; border-radius: 12px; font-size: 12px; font-weight: 600; background: var(--border); }
    .badge.connected { background: rgba(63, 185, 80, 0.2); color: var(--success); border: 1px solid var(--success); }
    .badge.connecting { background: rgba(210, 153, 34, 0.2); color: var(--warning); border: 1px solid var(--warning); }
    .badge.disconnected { background: rgba(248, 81, 73, 0.2); color: var(--danger); border: 1px solid var(--danger); }
    
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 24px; }
    .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; padding: 16px; }
    .card-title { font-size: 12px; color: var(--text-dim); text-transform: uppercase; margin-bottom: 8px; }
    .card-val { font-size: 18px; font-weight: 600; color: #f0f6fc; }
    
    .panel { background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; padding: 16px; margin-bottom: 24px; }
    .panel-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .btn { background: var(--primary); color: #0d1117; font-weight: 600; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; }
    .btn:hover { opacity: 0.9; }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }

    #logBox {
      background: #000;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 12px;
      font-size: 13px;
      line-height: 1.5;
      height: 260px;
      overflow-y: auto;
      color: #3fb950;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div style="display: flex; align-items: center; gap: 12px;">
        <img src="favicon.svg" alt="Logo" width="32" height="32" style="border-radius: 6px; display: block;">
        <h1>P2P WebRTC Gateway (Zero-Client)</h1>
      </div>
      <div style="display: flex; gap: 10px; align-items: center;">
        <button id="btnHeaderSettings" class="btn" style="background: #21262d; border: 1px solid var(--border); color: #c9d1d9; font-size: 13px; display: flex; align-items: center; gap: 6px; cursor: pointer;">
          ⚙ 节点与信令设置 (Settings)
        </button>
        <span id="connBadge" class="badge disconnected">DISCONNECTED</span>
      </div>
    </header>

    <div class="grid">
      <div class="card" id="cardPeer" style="cursor: pointer;" title="点击修改目标节点 ID / Click to configure Node ID">
        <div class="card-title" style="display: flex; justify-content: space-between;">
          <span>Target Node ID</span>
          <span style="font-size: 11px; color: var(--primary);">✎ 修改</span>
        </div>
        <div id="peerVal" class="card-val">-</div>
      </div>
      <div class="card" id="cardSignal" style="cursor: pointer;" title="点击修改信令服务端 / Click to configure Signal Server">
        <div class="card-title" style="display: flex; justify-content: space-between;">
          <span>Signaling Server</span>
          <span style="font-size: 11px; color: var(--primary);">✎ 修改</span>
        </div>
        <div id="signalVal" class="card-val">Connecting...</div>
      </div>
      <div class="card">
        <div class="card-title">P2P Latency (RTT)</div>
        <div id="rttVal" class="card-val">-</div>
      </div>
      <div class="card">
        <div class="card-title">Mux Streams</div>
        <div id="streamsVal" class="card-val">0 Active</div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-header">
        <h3>MVP Connectivity Controls</h3>
        <div>
          <button id="btnPing" class="btn" disabled>Ping Test</button>
          <button id="btnEcho" class="btn" disabled style="margin-left: 8px;">Run Echo Stream</button>
        </div>
      </div>
      <div id="testOutput" style="font-size: 13px; color: var(--text-dim); margin-top: 8px;">
        Ready to test multiplexed P2P data flow.
      </div>
    </div>

    <div class="panel">
      <div class="panel-header">
        <h3>Realtime Event Log</h3>
        <button id="btnClearLog" style="background: none; border: none; color: var(--text-dim); cursor: pointer;">Clear</button>
      </div>
      <div id="logBox"></div>
    </div>
  </div>

  <script type="module" src="portal.js"></script>
</body>
</html>
