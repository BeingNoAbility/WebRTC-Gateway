name = "webrtc-p2p-signal"
main = "cloudflare-worker/worker.js"
compatibility_date = "2024-04-03"
assets = { directory = "../web/dist", binding = "ASSETS" }

[durable_objects]
bindings = [
  { name = "ROOM", class_name = "SignalingRoom" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SignalingRoom"]
