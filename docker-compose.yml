# ==============================================================================
# Zero-Client WebRTC P2P Gateway - Docker Compose 生产与开发编排文件
#
# 包含两个核心服务：
# 1. server: 信令中继与 WebRTC 撮合服务 + 内嵌 Web 门户前端（自包含单二进制）
# 2. agent:  运行在目标内网/NAS/家庭服务器中的穿透守护进程，负责 P2P 打洞与流量反向代理
#
# 快速启动命令：
#   docker compose up -d
# 查看运行日志：
#   docker compose logs -f
# ==============================================================================

services:
  # ============================================================================
  # 1. 一体化服务端 (Signaling Server & Web Portal)
  #    - 提供浏览器访客访问的 Web 门户界面 (HTML5 + Service Worker + 沙箱虚拟化)
  #    - 提供 WebRTC SDP Offer/Answer 与 ICE Candidate 毫秒级信令撮合
  # ============================================================================
  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    image: webrtc-p2p-server:latest
    container_name: webrtc-p2p-server
    restart: unless-stopped
    ports:
      # [端口映射]
      # 默认 HTTP 门户与 WebSocket 信令端口
      - "8888:8888"
      # [可选 HTTPS/WSS 端口] 若启用自签名证书 (TLS_AUTO=true) 或挂载正式证书，可解开以下映射：
      # - "443:443"
      # [可选标准 HTTP 端口] 映射至宿主机 80 端口（可选）：
      # - "80:8888"
    environment:
      # ------------------------------------------------------------------------
      # 服务监听地址与端口
      # 默认监听 :8888。若需使用标准 HTTPS 端口 443，可改为 :443 并映射对应端口。
      # ------------------------------------------------------------------------
      - ADDR=:8888

      # ------------------------------------------------------------------------
      # 原生 HTTPS / TLS 零配置自签名模式 (TLS_AUTO)
      # 设为 true 时，服务端启动将在内存中自动生成 ECDSA P-256 自签名证书，
      # 并自动将本机所有局域网真实 IP (如 192.168.x.x) 和主机名注入证书 SAN 扩展中。
      # 作用：使局域网各端通过 IP 访问也能进入安全上下文 (Secure Context)，避免 Service Worker 白屏。
      # ------------------------------------------------------------------------
      - TLS_AUTO=false

      # ------------------------------------------------------------------------
      # 外部正式 TLS 证书路径 (需搭配 volumes 挂载证书文件)
      # 例如通过 Let's Encrypt 或已购买的域名证书：
      # ------------------------------------------------------------------------
      # - TLS_CERT=/etc/certs/fullchain.pem
      # - TLS_KEY=/etc/certs/privkey.pem

      # ------------------------------------------------------------------------
      # 服务端全局集群准入密钥 (SECRET) - 可选
      # 若配置此项，所有连接并注册的 Agent 必须提供匹配的 Secret 口令才能加入信令网络。
      # ------------------------------------------------------------------------
      # - SECRET=your_cluster_secret_token

      # ------------------------------------------------------------------------
      # 前端静态资源目录覆盖 (可选)
      # 默认使用编译进二进制的内嵌资源；若需要实时热更新前端页面，可挂载目录并配置此项。
      # ------------------------------------------------------------------------
      # - STATIC_DIR=/app/web/dist
    volumes:
      # [可选] 挂载宿主机 SSL 证书目录（只读）
      # - ./certs:/etc/certs:ro
      # [可选] 挂载自定义前端静态网页产物（用于免重新编译调试前端）
      # - ./web/dist:/app/web/dist:ro
      # [推荐] 与宿主机同步时区
      - /etc/localtime:/etc/localtime:ro
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================================================
  # 2. 内网穿透守护进程 (Gateway Agent)
  #    - 部署在需要被穿透的家庭 NAS、工作站或局域网私有云服务器上
  #    - 负责连接信令服务、执行 WebRTC NAT 打洞、直连访客浏览器并反代本地 Web 服务
  # ============================================================================
  agent:
    build:
      context: .
      dockerfile: Dockerfile.agent
    image: webrtc-p2p-agent:latest
    container_name: webrtc-p2p-agent
    restart: unless-stopped

    # --------------------------------------------------------------------------
    # 网络模式建议：
    # 1. [强烈推荐] Linux 宿主机推荐使用 "host" 网络模式：
    #    - Agent 可直接穿透访问宿主机回环地址 127.0.0.1 上的各类服务；
    #    - WebRTC 可直接获取宿主机所有物理网卡的 IP 候选，打洞与 NAT 探测性能最优。
    # 2. 若在 macOS / Windows Docker Desktop 或受限环境必须使用 Bridge 桥接模式：
    #    - 注释掉 network_mode: "host"；
    #    - 添加 extra_hosts: ["host.docker.internal:host-gateway"]；
    #    - 将 TARGET_URL 改为 http://host.docker.internal:8080 访问宿主机服务。
    # --------------------------------------------------------------------------
    network_mode: "host"
    # extra_hosts:
    #   - "host.docker.internal:host-gateway"

    environment:
      # ------------------------------------------------------------------------
      # 节点唯一标识符 (NODE_ID)
      # 用于区分不同的内网机器或服务，访客通过 https://portal/#<nodeId> 或 <nodeId>.p2p.domain 直连。
      # ------------------------------------------------------------------------
      - NODE_ID=homeserver

      # ------------------------------------------------------------------------
      # 信令服务器 WebSocket 地址 (SIGNAL_URL)
      # - 若与本地 server 同机运行 (host模式): ws://127.0.0.1:8888/ws
      # - 若 server 启用了 TLS_AUTO (自签HTTPS): wss://127.0.0.1:8888/ws (需搭配 INSECURE=true)
      # - 若使用公网信令或 Cloudflare Workers:  wss://signal.yourdomain.com/ws
      # ------------------------------------------------------------------------
      - SIGNAL_URL=ws://127.0.0.1:8888/ws

      # ------------------------------------------------------------------------
      # 目标内网 Web 服务地址 (TARGET_URL)
      # Agent 将把访客通过 P2P 隧道发来的所有 HTTP / WebSocket 请求透明反代到该目标。
      # 支持 HTTP/HTTPS、任意内网 IP 与端口、子路径。
      # 常见示例：
      #   - Jellyfin / Emby:      http://127.0.0.1:8096
      #   - Alist / OpenList:     http://127.0.0.1:5244
      #   - Vaultwarden:          http://127.0.0.1:8080
      #   - Immich:               http://127.0.0.1:2283
      #   - Portainer:            https://127.0.0.1:9443
      # ------------------------------------------------------------------------
      - TARGET_URL=http://127.0.0.1:8080

      # ------------------------------------------------------------------------
      # 跳过 TLS 证书校验 (INSECURE)
      # 当信令服务使用自签名证书 (如 TLS_AUTO=true) 或私有 CA 时，设为 true 可跳过证书链校验。
      # ------------------------------------------------------------------------
      - INSECURE=false

      # ------------------------------------------------------------------------
      # 预共享认证密钥 (SECRET) - 可选
      # 与信令服务对齐的安全鉴权 Token（留空表示不限制）。
      # ------------------------------------------------------------------------
      - SECRET=

      # ------------------------------------------------------------------------
      # 出站代理 (PROXY_URL) - 可选
      # 支持 HTTP、HTTPS、SOCKS5 代理，用于特殊受限内网连接外部信令服务器。
      # 例如：socks5://127.0.0.1:10808 或 http://127.0.0.1:7890
      # ------------------------------------------------------------------------
      - PROXY_URL=

      # ------------------------------------------------------------------------
      # TLS SNI 覆盖与 Host 头伪装 (SNI) - 可选
      # 当通过直连 Anycast IP（如 104.21.4.12）绕过 DNS 解析直连 Cloudflare 边缘时，
      # 配置此项注入正确的域名 Host 标头与 TLS ClientHello SNI。
      # 例如：p2p.yourdomain.com 或 webrtc-p2p-signal.yourdomain.com
      # ------------------------------------------------------------------------
      # - SNI=p2p.yourdomain.com

    volumes:
      # [推荐] 与宿主机同步时区
      - /etc/localtime:/etc/localtime:ro
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    # 若 Agent 独立部署在另一台机器直连公网信令，可移除 depends_on
    depends_on:
      - server
