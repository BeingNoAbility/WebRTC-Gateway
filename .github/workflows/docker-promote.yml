name: Promote Docker Image Tag

on:
  workflow_dispatch:
    inputs:
      source_tag:
        description: 'Existing image version tag (e.g. v5.0.0-alpha.1)'
        required: true
      channel:
        description: 'Floating tag to point at source_tag'
        required: true
        type: choice
        options:
          - alpha
          - beta
          - rc
          - latest

permissions:
  contents: read
  packages: write

jobs:
  promote:
    name: Promote (${{ matrix.image_name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image_name: [webrtc-p2p-server, webrtc-p2p-agent]

    steps:
      - name: Validate inputs
        env:
          SOURCE_TAG: ${{ inputs.source_tag }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          if ! printf '%s' "$SOURCE_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)\.[0-9]+)?$'; then
            echo "::error::source_tag must look like vX.Y.Z or vX.Y.Z-alpha.N / -beta.N / -rc.N"
            exit 1
          fi
          case "$CHANNEL" in
            latest)
              if printf '%s' "$SOURCE_TAG" | grep -q -- '-'; then
                echo "::error:::latest only accepts stable tags"
                exit 1
              fi
              ;;
            *)
              if ! printf '%s' "$SOURCE_TAG" | grep -q -- "-${CHANNEL}\."; then
                echo "::error:::${CHANNEL} only accepts vX.Y.Z-${CHANNEL}.N tags"
                exit 1
              fi
              ;;
          esac

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Point floating tag at the existing manifest
        env:
          SOURCE_TAG: ${{ inputs.source_tag }}
          CHANNEL: ${{ inputs.channel }}
          IMAGE_NAME: ${{ matrix.image_name }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${IMAGE_NAME}"
          docker buildx imagetools inspect "${image}:${SOURCE_TAG}" > /dev/null
          docker buildx imagetools create -t "${image}:${CHANNEL}" "${image}:${SOURCE_TAG}"
          docker buildx imagetools inspect "${image}:${CHANNEL}"
