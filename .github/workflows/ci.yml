name: CI

on:
  push:
    branches: [ master, main, dev ]
  pull_request:
    branches: [ master, main, dev ]

jobs:
  test-and-build:
    name: Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          check-latest: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify Web Frontend Build & Embedded Asset Cleanliness
        working-directory: ./web
        run: |
          npm ci
          npm run build
          git diff --exit-code dist

      - name: Run Web & Routing Tests
        run: npm --prefix web test

      - name: Verify Documentation Engineering Hygiene & Build
        run: |
          npm --prefix docs ci
          npm --prefix docs run docs:lint
          npm --prefix docs run docs:build

      - name: Run Go Unit & Integration Tests
        run: go test -v ./...

      - name: Build Agent & Server Binaries
        run: |
          mkdir -p bin
          go build -v -ldflags="-s -w" -o bin/agent ./cmd/agent
          go build -v -ldflags="-s -w" -o bin/signal ./cmd/signal
