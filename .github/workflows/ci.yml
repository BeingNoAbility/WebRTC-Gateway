name: CI

on:
  push:
    branches: [ master, main, dev, edge ]
  pull_request:
    branches: [ master, main, dev, edge ]

permissions:
  contents: read

jobs:
  test-and-build:
    name: Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26'
          check-latest: true

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'

      - name: Verify Release Hygiene & Version Parity Machine Gate
        run: |
          node scripts/verify-release-hygiene.mjs
          node --test test/hygiene/release_hygiene.test.mjs

      - name: Build Web Frontend & Audit Dependencies
        working-directory: ./web
        run: |
          npm ci
          npm audit --audit-level=high
          npm run build

      - name: Run Web & Go Signaling Conformance Tests
        run: |
          npm --prefix web test
          node --test test/conformance/signaling_conformance.test.mjs

      - name: Verify Documentation Engineering Hygiene, Audit & Build
        run: |
          npm --prefix docs ci
          npm --prefix docs audit --audit-level=high
          npm --prefix docs run docs:lint
          npm --prefix docs run docs:build

      - name: Check Go Formatting & Static Analysis
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Files not gofmt formatted:"
            echo "$unformatted"
            exit 1
          fi
          go vet ./...
          go vet -tags embedweb ./...
          go install honnef.co/go/tools/cmd/staticcheck@v0.8.2
          go install golang.org/x/vuln/cmd/govulncheck@v1.10.0
          go install github.com/securego/gosec/v2/cmd/gosec@v2.30.0
          "$(go env GOPATH)/bin/staticcheck" ./...
          "$(go env GOPATH)/bin/govulncheck" ./...
          "$(go env GOPATH)/bin/gosec" ./...

      - name: Run Go Unit & Integration Tests (-race, embedded web)
        run: go test -v -race -short -tags embedweb ./...

      - name: Run Go Fuzz Smoke Tests
        run: |
          for pkg in ./pkg/protocol ./pkg/proxy ./pkg/signaling; do
            fuzz_tests=$(go test -list '^Fuzz' "$pkg" 2>/dev/null | grep '^Fuzz' || true)
            for ft in $fuzz_tests; do
              go test -run='^$' -fuzz="^${ft}\$" -fuzztime=2s "$pkg"
            done
          done

      - name: Verify Benchmarks Compile
        run: go test -c -o /dev/null ./test

      - name: Build Agent & Embedded Server Binaries Once
        run: make build

      - name: Verify Embedded web.DistFS Completeness
        run: |
          embedded_files=$(go list -f '{{range .EmbedFiles}}{{println .}}{{end}}' -tags embedweb ./web)
          if [ ! -f web/dist/__p2p_gw__/manifest.json ]; then
            echo "ERROR: web/dist/__p2p_gw__/manifest.json is missing"
            exit 1
          fi
          node -e '
            const fs = require("node:fs");
            const manifest = JSON.parse(fs.readFileSync("web/dist/__p2p_gw__/manifest.json", "utf8"));
            const embedded = new Set(process.argv[1].trim().split(/\r?\n/).filter(Boolean));
            const required = ["dist/index.html", "dist/favicon.svg", "dist/__p2p_gw__/bridge.html", "dist/__p2p_gw__/manifest.json"];
            for (const rel of Object.values(manifest)) {
              if (typeof rel === "string") required.push("dist/" + rel.replace(/^\/+/, ""));
            }
            const missing = required.filter((f) => !embedded.has(f));
            if (missing.length > 0) {
              console.error("ERROR: missing embedded assets in web.DistFS:", missing.join(", "));
              process.exit(1);
            }
          ' "$embedded_files"

      - name: Run Chrome CDP Browser E2E Suites (Embedded DistFS)
        env:
          AGENT_BIN: ${{ github.workspace }}/bin/agent
          SIGNAL_BIN: ${{ github.workspace }}/bin/signal
        run: node --test test/e2e/browser_suite.test.mjs
