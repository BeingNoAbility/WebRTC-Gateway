name: Sync GitHub Wiki

on:
  push:
    branches:
      - main
    paths:
      - 'wiki/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-wiki:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main repo
        uses: actions/checkout@v4

      - name: Check if Wiki repository is initialized
        id: check_wiki
        run: |
          WIKI_URL="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.wiki.git"
          if git ls-remote "$WIKI_URL" > /dev/null 2>&1; then
            echo "initialized=true" >> $GITHUB_OUTPUT
          else
            echo "initialized=false" >> $GITHUB_OUTPUT
            echo "::warning ::GitHub Wiki repository has not been initialized yet on the web UI. Please visit https://github.com/${{ github.repository }}/wiki and click 'Create the first page' to activate it."
          fi

      - name: Sync to Wiki repo
        if: steps.check_wiki.outputs.initialized == 'true'
        run: |
          WIKI_URL="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.wiki.git"
          git clone "$WIKI_URL" wiki-repo
          cp -f wiki/*.md wiki-repo/
          cd wiki-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff-index --quiet HEAD --; then
            echo "Wiki documentation is already up to date."
          else
            git commit -m "docs(wiki): sync wiki docs from main repo [skip ci]"
            git push origin master || git push origin main
          fi
